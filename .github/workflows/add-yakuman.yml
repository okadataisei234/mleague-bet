name: 役満を登録

on:
  workflow_dispatch:
    inputs:
      player:
        description: "選手名（サイト表記。例: 伊達 朱里紗 / 多井 隆晴）"
        required: true
        type: string
      yakuman:
        description: "役満の種類（例: 国士無双、四暗刻、大三元）"
        required: true
        type: string
      date:
        description: "対局日 YYYY-MM-DD（空欄なら今日）"
        required: false
        type: string
      note:
        description: "メモ（任意）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yakuman.json に追記
        env:
          PLAYER: ${{ inputs.player }}
          YAKUMAN: ${{ inputs.yakuman }}
          DATE: ${{ inputs.date }}
          NOTE: ${{ inputs.note }}
        run: python scripts/add_yakuman.py
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/yakuman.json
          git commit -m "役満登録: ${{ inputs.player }} ${{ inputs.yakuman }}"
          git push
