name: 成績を自動更新

on:
  schedule:
    # UTC。JST 01:00 (対局終了後) と JST 12:00 の1日2回
    - cron: "0 16 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: m-league.jp から取得
        run: python scripts/scrape.py
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/stats.json docs/data/history.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "成績更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi
